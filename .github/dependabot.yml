# Dependabot: avisa de versiones nuevas con un Pull Request, nunca mezcla nada.
# Una vez por semana y de a poco, para no inundar a Hugo y Alex ni disparar decenas de despliegues
# de vista previa en Vercel.
#
# Los saltos MAYORES se ignoran a propósito, tanto en npm (next, react, typescript, sharp...) como en
# las GitHub Actions: los workflows de cron (Facturas IH, respaldos de Supabase) son de producción y una Action
# nueva puede cambiar su comportamiento. Un salto mayor se hace a mano, con prueba, cuando alguien
# lo decida. Los avisos de SEGURIDAD llegan aparte (Dependabot security updates).
#
# Los parches y los cambios menores van en dos grupos distintos: así un PR con veinte librerías
# no mezcla lo trivial con lo que puede cambiar el diseño (Tailwind) o la lectura de archivos.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Estas se actualizan SOLO a mano y con prueba: next.config.ts depende de sus detalles internos
      # (empaquetado de Turbopack, carpeta interna de pdf-parse, binarios de Chromium) y un parche
      # automático puede romper el build o la lectura de facturas sin avisar. Las alertas de
      # seguridad de GitHub siguen apareciendo igual.
      - dependency-name: next
      - dependency-name: eslint-config-next
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: pdf-parse
      - dependency-name: pdfjs-dist
      - dependency-name: react-pdf
      - dependency-name: playwright
      - dependency-name: playwright-core
      - dependency-name: "@sparticuz/chromium-min"
      # En versiones 0.x un cambio "menor" equivale a uno grande: sharp procesa las imágenes de la
      # Página web y los logos, y el SDK de Anthropic alimenta Rendir Gastos, Ofertas, el cotizador,
      # el buscador y el resumen diario.
      - dependency-name: sharp
      - dependency-name: "@anthropic-ai/sdk"
    groups:
      parches:
        update-types: ["patch"]
      menores:
        update-types: ["minor"]
    commit-message:
      prefix: "Dependencias"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Actions"
